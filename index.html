<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ульяна❤️</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: black;
  font-family: 'Arial Black', sans-serif;
  overflow-x: hidden;
  user-select: none;
}

/* Загрузка */
#loader {
  position: fixed;
  inset: 0;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}
#loader span {
  font-size: 32px;
  color: white;
  text-shadow: 0 0 10px white, 0 0 30px #ccc;
  animation: flicker 1.2s infinite alternate;
  font-family: 'Arial', sans-serif;
  font-weight: 300;
  letter-spacing: 0.2em;
}
@keyframes flicker {
  0% { opacity: 0.8; text-shadow: 0 0 6px white; }
  100% { opacity: 1; text-shadow: 0 0 14px white, 0 0 26px #ccc; }
}

/* Стартовый экран */
#start-screen {
  opacity: 0.6;
  display: none;
  justify-content: center;
  align-items: center;
  height: 100%;
  background: url('Picsart_25-07-06_12-49-05-878.jpg') center center no-repeat;
  background-size: 160%;
  animation: moveBG 40s ease-in-out infinite alternate;
  flex-direction: column;
  cursor: default;
}
@keyframes moveBG {
  0% { background-position: center center; }
  100% { background-position: 52% 48%; }
}
#start-screen h1 {
  font-size: 64px;
  color: white;
  text-shadow: 0 0 10px white, 0 0 30px #ccc;
  animation: flicker 1.5s infinite alternate;
  cursor: pointer;
  transition: transform 0.1s;
  font-family: 'Arial', sans-serif;
  font-weight: 300;
  letter-spacing: 0.25em;
  -webkit-tap-highlight-color: transparent;
  tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  outline: none;
}
#start-screen h1:active {
  transform: scale(0.92);
}

/* Подсказка "жми" */
#hint-wrap {
  position: absolute;
  top: calc(50% + 30px);
  left: calc(50% + 10px);
  display: flex;
  flex-direction: row;
  align-items: flex-end;
  gap: 4px;
  opacity: 0;
  animation: none;
  pointer-events: none;
}
#hint-wrap.visible {
  animation: hintFadeIn 0.6s ease forwards;
}
@keyframes hintFadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
#hint-text {
  font-size: 15px;
  font-family: 'Arial', sans-serif;
  font-weight: 300;
  letter-spacing: 0.2em;
  color: rgba(255,255,255,0.75);
  text-shadow: 0 0 8px rgba(255,255,255,0.4);
  margin-bottom: 12px;
}
#hint-arrow {
  width: 90px;
  height: 100px;
  opacity: 0.65;
}


/* Оверлей плавного перехода */
#transition-overlay {
  position: fixed;
  inset: 0;
  background: black;
  z-index: 9997;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.6s ease;
}

/* Плавное появление bio */
#video-section {
  opacity: 0;
}
#video-section.fade-in {
  animation: fadeInBio 0.8s ease forwards;
}
@keyframes fadeInBio {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Видео и блок */
#video-section {
  display: none;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  text-align: center;
  min-height: 100%;
  position: relative;
  z-index: 5;
  padding: 20px 20px 80px 20px;
  box-sizing: border-box;
  overflow-y: auto;
}
img#mainBg {
  position: fixed;
  top: 0; left: 0;
  width: 100vw;
  height: 100vh;
  object-fit: cover;
  z-index: 0;
  background: black;
  pointer-events: none;
  display: none;
}

/* Эффект сломанного ТВ */
#glitch {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 1;
  background: rgba(255,255,255,0.03);
  animation: glitchEffect 0.1s infinite;
  display: none;
}
@keyframes glitchEffect {
  0%   { opacity: 0.02; transform: translate(0,0); }
  10%  { opacity: 0.05; transform: translate(-2px,1px); }
  20%  { opacity: 0.03; transform: translate(1px,-1px); }
  30%  { opacity: 0.06; transform: translate(-1px,2px); }
  40%  { opacity: 0.04; transform: translate(2px,-2px); }
  50%  { opacity: 0.05; transform: translate(0,1px); }
  60%  { opacity: 0.03; transform: translate(-2px,0); }
  70%  { opacity: 0.06; transform: translate(1px,1px); }
  80%  { opacity: 0.04; transform: translate(-1px,-1px); }
  90%  { opacity: 0.05; transform: translate(2px,0); }
  100% { opacity: 0.03; transform: translate(0,0); }
}

/* Аватар */
#avatar-wrap {
  position: relative;
  z-index: 2;
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 4px;
  margin-top: 0;
}
#avatar {
  width: 180px;
  height: 180px;
  overflow: visible;
  position: relative;
  z-index: 3;
  flex-shrink: 0;
  animation: avatarSway 4s ease-in-out infinite;
  transform-origin: center bottom;
}
@keyframes avatarSway {
  0%   { transform: rotate(-1.5deg); }
  50%  { transform: rotate(1.5deg); }
  100% { transform: rotate(-1.5deg); }
}
#avatar img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  pointer-events: none;
  -webkit-user-drag: none;
  user-drag: none;
  -webkit-touch-callout: none;
}

/* Ник */
#username {
  font-size: 24px;
  color: white;
  text-shadow: 0 0 14px rgba(255,255,255,0.8);
  margin-top: 0px;
  margin-bottom: 6px;
  font-weight: 400;
  letter-spacing: 0.32em;
  font-family: 'Georgia', serif;
  z-index: 2;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  animation: usernameGlow 3s ease-in-out infinite;
}
@keyframes usernameGlow {
  0%, 100% { text-shadow: 0 0 8px rgba(255,255,255,0.6), 0 0 20px rgba(255,255,255,0.3); }
  50%       { text-shadow: 0 0 18px rgba(255,255,255,1), 0 0 40px rgba(255,255,255,0.7), 0 0 70px rgba(255,255,255,0.3); }
}

/* Сердечко под ником */
#username-heart {
  font-size: 14px;
  text-align: center;
  margin-top: 0px;
  margin-bottom: 4px;
  z-index: 2;
  animation: heartPulse 3s ease-in-out infinite;
  filter: drop-shadow(0 0 6px rgba(150,150,150,0.5));
}
@keyframes heartPulse {
  0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px rgba(255,255,255,0.4)); }
  50%       { transform: scale(1.15); filter: drop-shadow(0 0 10px rgba(255,255,255,0.9)); }
}

/* Сообщение под ником */
#name-message {
  font-size: 13px;
  color: #ff6b6b;
  font-family: 'Arial', sans-serif;
  letter-spacing: 0.08em;
  min-height: 16px;
  margin-bottom: 10px;
  z-index: 2;
  text-shadow: 0 0 8px rgba(255,100,100,0.5);
  opacity: 0;
  transition: opacity 0.3s ease;
}
#name-message.visible {
  opacity: 1;
}

/* Соцсети — glassmorphism карточки */
.social-box {
  margin-top: 4px;
  margin-bottom: 10px;
  padding: 0 20px;
  width: 230px;
  max-width: 75vw;
  display: flex;
  flex-direction: column;
  gap: 7px;
  align-items: stretch;
  z-index: 2;
}
.social-box a {
  font-size: 13px;
  color: white;
  text-decoration: none;
  padding: 6px 14px;
  border-radius: 10px;
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(22px) saturate(0.8);
  -webkit-backdrop-filter: blur(22px) saturate(0.8);
  border: 1px solid rgba(255,255,255,0.28);
  transition: background 0.3s ease, border-color 0.3s ease, transform 0.15s ease;
  display: flex;
  align-items: center;
  justify-content: space-between;
  letter-spacing: 0.15em;
  font-family: 'Arial', sans-serif;
  font-weight: 400;
  -webkit-tap-highlight-color: transparent;
  box-shadow: 0 2px 16px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
  opacity: 0.82;
}
.social-box a:hover {
  background: rgba(255,255,255,0.09);
  border-color: rgba(255,255,255,0.38);
  transform: scale(1.015);
  opacity: 1;
}
.social-box a:active {
  transform: scale(0.97);
  background: rgba(255,255,255,0.1);
}
.social-link-left {
  display: flex;
  align-items: center;
  gap: 14px;
}
.social-icon-wrap {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.social-box a i {
  font-size: 13px;
  opacity: 1;
  filter: drop-shadow(0 0 4px rgba(255,255,255,0.6));
  animation: iconGlow 3s ease-in-out infinite;
}
@keyframes iconGlow {
  0%, 100% { filter: drop-shadow(0 0 3px rgba(255,255,255,0.5)); }
  50%       { filter: drop-shadow(0 0 10px rgba(255,255,255,1)) drop-shadow(0 0 20px rgba(255,255,255,0.5)); }
}
.social-link-name {
  letter-spacing: 0.18em;
  font-size: 13px;
  animation: textGlow 3s ease-in-out infinite;
}
@keyframes textGlow {
  0%, 100% { text-shadow: 0 0 6px rgba(255,255,255,0.4); }
  50%       { text-shadow: 0 0 14px rgba(255,255,255,1), 0 0 30px rgba(255,255,255,0.5); }
}
.social-arrow {
  font-size: 20px;
  opacity: 0.7;
  transition: opacity 0.2s, transform 0.2s;
}
.social-box a:hover .social-arrow {
  opacity: 1;
  transform: translateX(3px);
}
/* ⭒ Звёзды на фоне */
#star-layer {
  position: fixed;
  inset: 0;
  z-index: 6;
  pointer-events: none;
  overflow: hidden;
}
.bg-star {
  position: absolute;
  color: white;
  font-size: 10px;
  line-height: 1;
  pointer-events: none;
  will-change: opacity;
  animation: bgStarGlow var(--dur) ease-in-out infinite alternate;
  animation-delay: var(--delay);
}
@keyframes bgStarGlow {
  0%   { opacity: 0.4; text-shadow: 0 0 6px white, 0 0 14px rgba(255,255,255,0.7); }
  100% { opacity: 1;   text-shadow: 0 0 14px white, 0 0 30px white, 0 0 50px rgba(255,255,255,0.8); }
}

/* День/Ночь */
#day-night-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin-bottom: 10px;
  margin-top: 8px;
  z-index: 2;
}
#sun-btn, #moon-btn {
  font-size: 22px;
  cursor: pointer;
  opacity: 0.7;
  transition: opacity 0.3s ease, transform 0.2s ease;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  filter: drop-shadow(0 0 6px rgba(255,255,255,0.5));
}
#sun-btn:hover, #moon-btn:hover { opacity: 1; transform: scale(1.15); }
#sun-btn:active, #moon-btn:active { transform: scale(0.9); }

/* Ночной режим — оверлей поверх видео */
#night-overlay {
  position: fixed;
  inset: 0;
  background: black;
  z-index: 3;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.8s ease;
}
#night-overlay.active {
  opacity: 1;
}
a, button, div[onclick] {
  -webkit-tap-highlight-color: transparent;
  tap-highlight-color: transparent;
}

/* Кнопка паузы */
#pause-button {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.4);
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 2;
  box-shadow: 0 0 10px rgba(255,255,255,0.3), 0 0 24px rgba(255,255,255,0.1);
  transition: box-shadow 0.3s ease, transform 0.15s ease;
  color: white;
  font-size: 16px;
  margin-bottom: 10px;
  margin-top: 8px;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
#pause-button:hover {
  box-shadow: 0 0 16px rgba(255,255,255,0.6), 0 0 36px rgba(255,255,255,0.2);
  transform: scale(1.08);
}
#pause-button:active {
  transform: scale(0.95);
}
#pause-button:focus {
  outline: none;
}

/* Футер */
footer {
  display: none;
  position: relative;
  width: 100%;
  text-align: center;
  font-size: 10px;
  color: rgba(255,255,255,0.92);

  letter-spacing: 0.1em;
  text-shadow: 0 0 8px rgba(0,0,0,0.8);
  z-index: 2;
  margin-top: 90px;
  padding-bottom: 24px;
  box-sizing: border-box;
  opacity: 0.8;
}
footer a {
  text-decoration: none;
  color: #ff6b6b;
}

/* Статус online/offline */
#status-badge {
  position: fixed;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10000;
  display: flex;
  align-items: center;
  gap: 4px;
  background: rgba(0,0,0,0.45);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px;
  padding: 3px 6px 3px 5px;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  tap-highlight-color: transparent;
  outline: none;
  user-select: none;
  -webkit-user-select: none;
}

/* Статус — сообщение при клике */
#status-message {
  position: fixed;
  z-index: 9999;
  background: rgba(0,0,0,0.55);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 8px 14px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  font-family: 'Arial', sans-serif;
  font-size: 12px;
  color: rgba(255,255,255,0.85);
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  transform: translateX(-50%);
  max-width: 90vw;
  white-space: normal;
  text-align: center;
  line-height: 1.5;
  box-sizing: border-box;
}
#status-message.visible {
  opacity: 1;
}

@media (max-width: 480px) {
  #status-message { font-size: 11px; padding: 7px 12px; }
  #status-badge { top: 12px; }
  #avatar { width: 220px; height: 220px; }
  #username { font-size: 22px; }

  #video-section { padding: 50px 16px 16px 16px; }
}

@media (min-width: 768px) {
  #avatar { width: 300px; height: 300px; }
  #username { font-size: 30px; }
  .social-box { width: 270px; }
  #video-section {
    justify-content: center;
    padding: 80px 40px 40px 40px;
  }
  footer {
    position: fixed;
    bottom: 16px;
    left: 0;
    width: 100%;
    margin-top: 0;
    padding-bottom: 0;
  }
}
#status-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  flex-shrink: 0;
}
#status-dot.online {
  background: #3dff7a;
  box-shadow: 0 0 6px #3dff7a, 0 0 14px #3dff7a;
  animation: pulse-green 2s ease-in-out infinite;
}
#status-dot.offline {
  background: #ff4444;
  box-shadow: 0 0 6px #ff4444, 0 0 14px #ff4444;
  animation: pulse-red 2s ease-in-out infinite;
}
@keyframes pulse-green {
  0%, 100% { box-shadow: 0 0 5px #3dff7a, 0 0 12px #3dff7a; }
  50%       { box-shadow: 0 0 10px #3dff7a, 0 0 24px #3dff7a; }
}
@keyframes pulse-red {
  0%, 100% { box-shadow: 0 0 5px #ff4444, 0 0 12px #ff4444; }
  50%       { box-shadow: 0 0 10px #ff4444, 0 0 24px #ff4444; }
}
#status-text {
  font-size: 6px;
  font-family: 'Arial', sans-serif;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: white;
}
</style>

<script>
// Звёзды вкл/выкл
let starsVisible = false;
function setNightMode() {
  const overlay = document.getElementById('night-overlay');
  const layer = document.getElementById('star-layer');
  overlay.classList.add('active');
  starsVisible = true;
  layer.innerHTML = '';
  spawnStars();
  layer.style.opacity = '1';
  layer.style.transition = 'opacity 0.8s ease';
}

function setDayMode() {
  const overlay = document.getElementById('night-overlay');
  const layer = document.getElementById('star-layer');
  overlay.classList.remove('active');
  starsVisible = false;
  layer.style.transition = 'opacity 0.8s ease';
  layer.style.opacity = '0';
  setTimeout(() => { layer.innerHTML = ''; }, 800);
}


function spawnStars() {
  const layer = document.getElementById('star-layer');
  const count = 40;
  for (let i = 0; i < count; i++) {
    const s = document.createElement('span');
    s.className = 'bg-star';
    s.textContent = '⭒';
    s.style.left = (Math.random() * 100) + '%';
    s.style.top  = (Math.random() * 100) + '%';
    s.style.setProperty('--dur',   (3 + Math.random() * 4).toFixed(2) + 's');
    s.style.setProperty('--delay', (Math.random() * 6).toFixed(2) + 's');
    s.style.fontSize = (7 + Math.random() * 7).toFixed(0) + 'px';
    layer.appendChild(s);
  }
}

window.addEventListener("load", () => {
  // Всё загружено — убираем лоадер сразу (небольшой fade для плавности)
  const loader = document.getElementById('loader');
  if (loader) {
    loader.style.transition = 'opacity 0.4s ease';
    loader.style.opacity = '0';
    setTimeout(() => loader.remove(), 400);
  }
  const startScreen = document.getElementById('start-screen');
  startScreen.style.display = 'flex';
  // Подсказка через 1.5 сек
  setTimeout(() => {
    const hint = document.getElementById('hint-wrap');
    if (hint) hint.classList.add('visible');
  }, 1500);
});

function startSite(e) {
  const startScreen = document.getElementById('start-screen');
  const videoSection = document.getElementById('video-section');
  const audio = document.getElementById('mainAudio');
  const footer = document.querySelector('footer');
  const overlay = document.getElementById('transition-overlay');

  // Плавный переход
  overlay.style.opacity = '1';
  setTimeout(() => {
    startScreen.style.display = 'none';
    videoSection.style.display = 'flex';
    videoSection.classList.add('fade-in');
    footer.style.display = 'block';
    document.getElementById('mainBg').style.display = 'block';
    document.getElementById('glitch').style.display = 'block';
    audio.play().catch(err => console.error("⚠️ Ошибка воспроизведения:", err));
    setTimeout(() => { overlay.style.opacity = '0'; }, 100);
  }, 500);
}

function togglePlayback() {
  const audio = document.getElementById('mainAudio');
  const icon = document.getElementById('pause-icon');
  const glitch = document.getElementById('glitch');

  if (audio.paused) {
    audio.play();
    icon.className = 'fas fa-pause';
    glitch.style.animationPlayState = 'running';
  } else {
    audio.pause();
    icon.className = 'fas fa-play';
    glitch.style.animationPlayState = 'paused';
  }
}

let dots = 0;
const loadingInterval = setInterval(() => {
  const loadingText = document.getElementById('loading-text');
  if (!loadingText) { clearInterval(loadingInterval); return; }
  dots = (dots + 1) % 4;
  loadingText.textContent = 'Загрузка' + '.'.repeat(dots);
}, 500);

// ======= СТАТУС ONLINE/OFFLINE =======
function updateStatus() {
  const hour = new Date().getHours();
  const dot = document.getElementById('status-dot');
  const text = document.getElementById('status-text');
  if (hour >= 8 && hour < 22) {
    dot.className = 'online';
    text.textContent = 'online';
    text.style.textTransform = 'none';
  } else {
    dot.className = 'offline';
    text.textContent = 'offline';
    text.style.textTransform = 'none';
  }
}
updateStatus();
setInterval(updateStatus, 60000);

// ======= СООБЩЕНИЕ ПРИ КЛИКЕ НА СТАТУС =======
let statusMsgOpen = false;
let typewriterTimer = null;

function toggleStatusMessage() {
  const badge = document.getElementById('status-badge');
  const msg = document.getElementById('status-message');
  const hour = new Date().getHours();
  const isOnline = hour >= 8 && hour < 22;

  if (statusMsgOpen) {
    msg.classList.remove('visible');
    statusMsgOpen = false;
    if (typewriterTimer) clearTimeout(typewriterTimer);
    return;
  }

  // Позиционируем под бейджем по центру экрана
  const rect = badge.getBoundingClientRect();
  msg.style.top = (rect.bottom + 8) + 'px';
  msg.style.left = '50%';
  msg.textContent = '';
  msg.classList.add('visible');
  statusMsgOpen = true;

  const text = isOnline
    ? 'Строю воздушные замки. Кирпичики — твои сообщения.'
    : 'Ушла искать радугу за дождем. Вернусь, когда высплюсь или просплю эту жизнь.';

  let i = 0;
  function typeNext() {
    if (i < text.length) {
      msg.textContent += text[i];
      i++;
      typewriterTimer = setTimeout(typeNext, 38 + Math.random() * 30);
    }
  }
  typeNext();
}
// ======= ПАСХАЛКА УДАЛЕНА =======


let nameMsgOpen = false;
let nameTypeTimer = null;

function toggleNameMessage() {
  const msg = document.getElementById('name-message');
  if (nameMsgOpen) {
    msg.classList.remove('visible');
    msg.textContent = '';
    nameMsgOpen = false;
    if (nameTypeTimer) clearTimeout(nameTypeTimer);
    return;
  }
  msg.textContent = '';
  msg.classList.add('visible');
  nameMsgOpen = true;
  const text = 'Я Ульяна, йоу';
  let i = 0;
  function typeNext() {
    if (i < text.length) {
      msg.textContent += text[i];
      i++;
      nameTypeTimer = setTimeout(typeNext, 45 + Math.random() * 35);
    }
  }
  typeNext();
}
